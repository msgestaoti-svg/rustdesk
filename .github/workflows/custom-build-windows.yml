name: Suporte Remoto - Windows x64
on:
  workflow_dispatch:
    inputs:
      brand:
        description: Identidade visual
        required: true
        type: choice
        default: ms
        options:
          - ms
          - csa
permissions:
  contents: read
env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.3"
  BRAND: ${{ inputs.brand }}
  APP_NAME: ${{ inputs.brand == 'csa' && 'CSA-Suporte_Remoto' || 'MS-Suporte_Remoto' }}
  MANUFACTURER: ${{ inputs.brand == 'csa' && 'MS Tecnologia' || 'Marcelo Santana - Gestão em TI' }}
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Configure default self-hosted server
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ vars.RS_PUB_KEY }}
        run: |
          python - <<'PYCODE'
          import os, base64
          from pathlib import Path
          server = os.environ['RENDEZVOUS_SERVER'].strip()
          key = os.environ['RS_PUB_KEY'].strip()
          if not server or len(base64.b64decode(key, validate=True)) != 32:
              raise SystemExit('Invalid server or public key')
          p = Path('libs/hbb_common/src/config.rs')
          text = p.read_text(encoding='utf-8')
          old = 'pub static ref DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
          new = '''pub static ref DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = RwLock::new(HashMap::from([
              ("custom-rendezvous-server".to_owned(), env!("RENDEZVOUS_SERVER").trim().to_owned()),
              ("key".to_owned(), env!("RS_PUB_KEY").trim().to_owned()),
          ]));'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected config.rs revision; patch not applied')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PYCODE
          printf 'RENDEZVOUS_SERVER=%s\nRS_PUB_KEY=%s\n' "$RENDEZVOUS_SERVER" "$RS_PUB_KEY" >> "$GITHUB_ENV"

      - name: Set custom application name
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('libs/hbb_common/src/config.rs')
          text = p.read_text(encoding='utf-8')
          old = 'pub static ref APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned());'
          import os
          new = old.replace('"RustDesk"', '"' + os.environ['APP_NAME'] + '"')
          if text.count(old) != 1:
              raise SystemExit('Unexpected APP_NAME definition; patch not applied')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PYCODE

      - name: Apply selected branding
        shell: bash
        run: |
          python - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          brand = os.environ['BRAND']
          if brand not in ('ms', 'csa'):
              raise SystemExit('Invalid brand')
          source = Path('branding') / brand
          targets = {
              'app_icon.ico': 'flutter/windows/runner/resources/app_icon.ico',
              'icon.ico': 'res/icon.ico',
              'icon.png': 'res/icon.png',
              'tray-icon.ico': 'res/tray-icon.ico',
              'icon.svg': 'flutter/assets/icon.svg',
              'logo.svg': 'res/logo.svg',
              'logo-header.svg': 'res/logo-header.svg',
          }
          for name, target in targets.items():
              shutil.copyfile(source / name, target)
          shutil.copyfile(source / 'logo-header.svg', 'flutter/assets/brand-header.svg')
          p = Path('flutter/lib/desktop/pages/desktop_home_page.dart')
          text = p.read_text(encoding='utf-8')
          anchor = 'child: loadLogo(),'
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected home page revision')
          text = text.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter_svg/flutter_svg.dart';")
          text = text.replace(anchor, """child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                child: ClipRRect(
                  borderRadius: BorderRadius.circular(4),
                  child: SvgPicture.asset(
                    'assets/brand-header.svg',
                    width: 180,
                    fit: BoxFit.contain,
                  ),
                ),
              ),""")
          if brand == 'ms':
              anchor = '      buildTip(context),'
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected home page display anchor')
              text = text.replace(anchor, """      const Padding(
                padding: EdgeInsets.only(bottom: 8),
                child: Center(child: Text('MS - Suporte Remoto',
                  textAlign: TextAlign.center,
                  style: TextStyle(fontWeight: FontWeight.w600))),
              ),
          buildTip(context),""")
          p.write_text(text, encoding='utf-8')
          PYCODE

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/"${APP_NAME}.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          # Select the MSBuild process architecture; -p:Platform sets the MSI target.
          # Native ARM64 tools give the compiler more address space for PCH files
          # (C3859/C1076 were reported by HostX86\arm64\CL.exe).
          # Keep the action's default x86 MSBuild for the existing x64 MSI job.
          msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}

      - name: Set MS installer display names
        if: ${{ inputs.brand == 'ms' }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import re
          from pathlib import Path
          root = Path('res/msi/Package')
          product = '$(var.Product)'
          display = 'MS - Suporte Remoto'
          package = root / 'Package.wxs'
          text = package.read_text(encoding='utf-8-sig')
          old = '<Package Name="$(var.Product)"'
          if text.count(old) != 1:
              raise SystemExit('Unexpected MSI package name')
          package.write_text(text.replace(old, '<Package Name="' + display + '"'), encoding='utf-8-sig')
          count = 0
          for p in root.rglob('*.wxs'):
              raw = p.read_bytes()
              text = raw.decode('utf-8-sig')
              def rename(m):
                  global count
                  tag = m.group(0)
                  new, n = re.subn(r'(?<![\w:])Name="\$\(var\.Product\)"', 'Name="' + display + '"', tag)
                  count += n
                  return new
              updated = re.sub(r'<Shortcut\b[^>]*>', rename, text)
              if updated != text:
                  p.write_bytes((b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b'') + updated.encode('utf-8'))
          if not count:
              raise SystemExit('No matching MSI shortcut names; inspect WiX source before proceeding')
          print(f'Updated {count} shortcut definitions')
          PYCODE

      - name: Build msi
        # Builds the MSI for the matrix arch. res/msi (WiX v4 + native CustomActions) carries
        # both x64 and ARM64 platform configs; WcaUtil/DUtil ship arm64 libs. msbuild platform
        # is x64 / ARM64; the produced Package.msi is globbed since its bin/<platform>/ dir varies.
        run: |
          pushd ./res/msi
          Rename-Item ../../rustdesk/rustdesk.exe "$env:APP_NAME.exe"
          python preprocess.py --arp -d ../../rustdesk --app-name "$env:APP_NAME" --manufacturer "$env:MANUFACTURER"
          if ($LASTEXITCODE -ne 0) { throw "MSI preprocess failed" }
          git restore -- Package/License.rtf
          nuget restore msi.sln
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../SignOutput/$env:APP_NAME.msi"
          sha256sum "../../SignOutput/$env:APP_NAME.msi"

      - name: Upload Windows EXE and MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: SignOutput/*
          if-no-files-found: error

  prepare-release:
    name: Prepare draft release
    needs: build-for-windows-flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: release-files
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${BRAND}-windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            "release-files/${APP_NAME}.exe" \
            "release-files/${APP_NAME}.msi" \
            --target "$GITHUB_SHA" \
            --title "${APP_NAME} - Windows x64 (${GITHUB_RUN_NUMBER})" \
            --notes "Cliente personalizado baseado no RustDesk, AGPL-3.0. Código e alterações de compilação: https://github.com/${GH_REPO}/tree/${GITHUB_SHA}." \
            --draft
